distributed:
  backend: nccl
  comms_dtype: None
  find_unused_parameters: false
  timeout_mins: 30
  gradient_as_bucket_view: true
  bucket_cap_mb: 25
  broadcast_buffers: true
cuda:
  cudnn_deterministic: false
  cudnn_benchmark: false
  allow_tf32: true
seed_value: 42
exp_name: fin3r_release
max_epochs: 10
limit_train_batches: null
accum_steps: 1
logging:
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  log_level_primary: INFO
  log_level_secondary: WARNING
  all_ranks: false
  log_visuals: false
  log_dir: ${oc.env:FIN3R_RUN}/logs
  log_freq: 5
  scalar_keys_to_log:
    train:
      keys_to_log:
      - loss_objective
      - loss_distill
      - loss_gt_depth
      - loss_pointmap
      - loss_anchor_xyz
checkpoint:
  save_dir: ${oc.env:FIN3R_RUN}/checkpoints
  resume_checkpoint_path: null
data:
  train:
    _target_: fin3r.coverage_data.CoverageFin3RData
    root: ${oc.env:FIN3R_DATA}
    labels: ${oc.env:FIN3R_LABELS}
    schedule_dir: ${oc.env:FIN3R_SCHEDULE}
    global_batch_size: 64
    updates_per_epoch: 357
    num_workers: 0
    mono_points: true
  val: null
model:
  _target_: fin3r.model.Fin3RVGGT
  base_path: ${oc.env:FIN3R_WEIGHTS}/vggt.pt
  olora: true
loss:
  _target_: fin3r.loss.Fin3RLoss
  penalty: 0.2
optim:
  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-5
    weight_decay: 0.05
  amp:
    enabled: true
    amp_dtype: bfloat16
  frozen_module_names: []
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
    - module_name:
      - aggregator
      max_norm: 1.0
      norm_type: 2
  options:
    weight_decay:
    - scheduler:
        _target_: fvcore.common.param_scheduler.ConstantParamScheduler
        value: 0.05
    lr:
    - scheduler:
        _target_: fvcore.common.param_scheduler.CompositeParamScheduler
        schedulers:
        - _target_: fvcore.common.param_scheduler.LinearParamScheduler
          start_value: 1.0e-06
          end_value: 0.0001
        - _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: 0.0001
          end_value: 1.0e-06
        lengths:
        - 0.1
        - 0.9
        interval_scaling:
        - rescaled
        - rescaled
